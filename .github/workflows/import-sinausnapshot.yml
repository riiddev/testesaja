name: One-time import from SINAUENGLISHV2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-sinausnapshot.yml

permissions:
  contents: write

jobs:
  replace-target:
    runs-on: ubuntu-latest
    steps:
      - name: Check out testesaja
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Clone source repository (read-only)
        run: git clone --depth 1 --branch main https://github.com/riiddev/SINAUENGLISHV2.git "$RUNNER_TEMP/source"

      - name: Replace target files with source snapshot
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='dist-ssr/' \
            --exclude='test-results/' \
            "$RUNNER_TEMP/source/" "$GITHUB_WORKSPACE/"

          git add -A

          if git diff --cached --quiet; then
            echo "Target already matches source snapshot."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: replace testesaja with SINAUENGLISHV2 snapshot"
          git push origin HEAD:main
