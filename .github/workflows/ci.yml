name: SinauEnglish V2 CI

on:
  push:
    branches: [ main, feat/neon-migration, fix/fase4-economy-atomicity ]
  pull_request:
    branches: [ main ]

concurrency:
  group: sinauuenglish-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full Build, Audit, API & SPA Smoke Suite
    runs-on: ubuntu-latest
    env:
      # Always use the isolated Neon Development direct connection for tests.
      # It is never copied into Vercel Production.
      DATABASE_URL: ${{ secrets.NEON_DEV_DIRECT_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify isolated Neon Development test database is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret NEON_DEV_DIRECT_URL is required for the full integration suite."
            exit 1
          fi
          node --input-type=module -e '
            const u = new URL(process.env.DATABASE_URL);
            if (!["postgres:", "postgresql:"].includes(u.protocol)) {
              throw new Error("Expected a PostgreSQL development connection.");
            }
            if (u.hostname.includes("-pooler")) {
              throw new Error("CI tests require the direct Neon Development connection.");
            }
            console.log("Direct Neon Development test connection is configured; credentials are hidden.");
          '

      - name: Create ephemeral Better Auth test secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://localhost:5173" >> "$GITHUB_ENV"

      - name: Run complete test:all suite
        run: npm run test:all
