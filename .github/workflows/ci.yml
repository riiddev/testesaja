name: SinauEnglish V2 CI

on:
  push:
    branches: [ main, feat/neon-migration, fix/fase4-economy-atomicity ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest
    env:
      # Expose the optional repository secret to step conditions without ever
      # printing it. Backend integration tests run only when it is configured.
      DATABASE_URL: ${{ secrets.NEON_DEV_DIRECT_URL != '' && secrets.NEON_DEV_DIRECT_URL || secrets.DATABASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Content Parity & Core SRS Logic
        run: npm test

      - name: Verify Adaptive Learning Logic
        run: npm run test:logic

      - name: Build Vite Client
        run: npm run build

      - name: Create ephemeral Better Auth test secret
        if: ${{ env.DATABASE_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://localhost:5173" >> "$GITHUB_ENV"

      - name: Run Backend Integration & Security Tests
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run test:api

